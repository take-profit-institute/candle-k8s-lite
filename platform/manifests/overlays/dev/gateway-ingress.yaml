# API 진입 — gateway 서비스로 라우팅.
# prod의 CloudFront+APIGW 흐름 대체 (JWT는 gateway 서비스 자체에서 검증).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: candle
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.lite.candle.io.kr, app.lite.candle.io.kr, admin.lite.candle.io.kr]
      secretName: gateway-tls
  rules:
    - host: api.lite.candle.io.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
    # 프론트엔드 정적 번들(클러스터 내 nginx). API는 api.* 의 gateway를 통해 호출한다.
    # (이전에는 이 호스트가 bff로 직결돼 있었으나, bff는 gateway 뒤에 있는 내부 서비스다.)
    - host: app.lite.candle.io.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
    - host: admin.lite.candle.io.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
