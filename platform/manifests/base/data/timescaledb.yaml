# Market TimescaleDB — 시계열 (RDS 미지원이라 인클러스터, prod와 동일 방식)
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: candle
spec:
  clusterIP: None
  selector: {app: timescaledb}
  ports:
    - {port: 5432, targetPort: 5432}
---
# timescaledb-creds Secret(username=market)은 init-secrets-job이 랜덤 생성한다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: candle
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels: {app: timescaledb}
  template:
    metadata:
      labels: {app: timescaledb}
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.17.1-pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: market}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: timescaledb-creds, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: timescaledb-creds, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 20Gi}
