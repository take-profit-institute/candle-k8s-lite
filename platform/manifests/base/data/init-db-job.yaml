# postgres 부트스트랩 Job — prod와 동일 구조로 초기화:
#   단일 DB `candle` + 서비스별 schema (auth/users/trading/…) + role
#   trading은 추가로 account/order_svc/reservation schema 소유
#   각 서비스 role은 자기 schema 소유 + candle DB CREATE 권한(Flyway용)
#   debezium role은 REPLICATION 권한 + 각 schema SELECT
#   <svc>-db k8s Secret: SPRING_DATASOURCE_URL은 ?currentSchema=<schema>,public 방식
#
# 재실행 안전(idempotent). 스냅샷 pg_restore 후 다시 apply해도 문제 없음.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: init-db
  namespace: candle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: init-db
  namespace: candle
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: init-db
  namespace: candle
subjects:
  - {kind: ServiceAccount, name: init-db, namespace: candle}
roleRef:
  kind: Role
  name: init-db
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-db-script
  namespace: candle
data:
  init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    export PGPASSWORD="$SUPERUSER_PASSWORD"
    PSQL="psql -h postgres -U postgres -v ON_ERROR_STOP=1"

    APP_DB="candle"

    # (svc = k8s ServiceAccount/서비스명, schema = pg schema, prefix = env prefix, extra_url_params = 추가 쿼리스트링)
    # trading은 여러 schema를 currentSchema에 나열 (prod와 동일).
    # learning은 stringtype=unspecified 필요.
    SERVICES=(
      "auth-service:auth:AUTH:"
      "user-service:users:USER:"
      "trading-service:trading:TRADING:"                  # currentSchema 조립은 아래 특수 처리
      "portfolio-service:portfolio:PORTFOLIO:"
      "ranking-service:ranking:RANKING:"
      "mission-service:mission:MISSION:"
      "learning-service:learning:LEARNING:&stringtype=unspecified"
      "notification-service:notification:NOTIFICATION:"
      "stock-service:stock:STOCK:"
      "news-service:news:NEWS:"
      "wishlist-service:wishlist:WISHLIST:"
      "batch:batch:BATCH:"
    )
    TRADING_EXTRA_SCHEMAS=(account order_svc reservation)

    # ── 1) DB 생성 (없으면)
    if ! $PSQL -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$APP_DB'" | grep -q 1; then
      $PSQL -d postgres -c "CREATE DATABASE \"$APP_DB\";"
    fi

    # ── 2) debezium role — -c 옵션으로 통일 (YAML/heredoc terminator 이슈 회피)
    $PSQL -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='debezium') THEN CREATE ROLE debezium WITH LOGIN REPLICATION PASSWORD 'candle-dev-debezium-pw'; END IF; END \$\$;"
    # CREATE 권한: prod는 Terraform이 publication을 사전생성하지만 lite는 커넥터가
    # publication.autocreate.mode=filtered로 직접 만든다 → CREATE PUBLICATION에 DB CREATE 필요.
    $PSQL -d "$APP_DB" -c "GRANT CONNECT ON DATABASE \"$APP_DB\" TO debezium; GRANT CREATE ON DATABASE \"$APP_DB\" TO debezium;"

    # ── 3) 서비스별 role + schema (owner) + 권한
    for entry in "${SERVICES[@]}"; do
      IFS=':' read -r svc schema prefix extra_params <<<"$entry"
      pw="candle-dev-${svc}-pw"

      echo "─ role/schema for $svc (schema=$schema) ─"

      # 3a) role — heredoc 대신 -c로 통일 (YAML block scalar에서 terminator indent 이슈 회피)
      $PSQL -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='$schema') THEN CREATE ROLE \"$schema\" WITH LOGIN PASSWORD '$pw'; END IF; END \$\$;"

      # 3b) schema (owner = 해당 role) + grants — 세미콜론 다중 statement
      # CREATE PUBLICATION ... FOR TABLE은 대상 테이블 소유자여야 한다. debezium을 서비스 role의
      # 멤버로 넣어 소유권 검사를 통과시킨다(멤버십 = has_privs_of_role). prod는 사전생성이라 불필요.
      $PSQL -d "$APP_DB" -c "CREATE SCHEMA IF NOT EXISTS \"$schema\" AUTHORIZATION \"$schema\"; GRANT CONNECT ON DATABASE \"$APP_DB\" TO \"$schema\"; GRANT CREATE ON DATABASE \"$APP_DB\" TO \"$schema\"; GRANT USAGE ON SCHEMA \"$schema\" TO debezium; GRANT SELECT ON ALL TABLES IN SCHEMA \"$schema\" TO debezium; ALTER DEFAULT PRIVILEGES FOR ROLE \"$schema\" IN SCHEMA \"$schema\" GRANT SELECT ON TABLES TO debezium; GRANT \"$schema\" TO debezium;"

      # 3c) trading 추가 schema
      if [ "$schema" = "trading" ]; then
        for extra in "${TRADING_EXTRA_SCHEMAS[@]}"; do
          $PSQL -d "$APP_DB" -c "CREATE SCHEMA IF NOT EXISTS \"$extra\" AUTHORIZATION \"trading\"; GRANT USAGE ON SCHEMA \"$extra\" TO debezium; GRANT SELECT ON ALL TABLES IN SCHEMA \"$extra\" TO debezium; ALTER DEFAULT PRIVILEGES FOR ROLE \"trading\" IN SCHEMA \"$extra\" GRANT SELECT ON TABLES TO debezium;"
        done
      fi

      # 3d) k8s Secret — SPRING_DATASOURCE_URL은 ?currentSchema=<schema>,public
      if [ "$schema" = "trading" ]; then
        current_schema="trading,account,order_svc,reservation,public"
      else
        current_schema="${schema},public"
      fi
      spring_url="jdbc:postgresql://postgres:5432/${APP_DB}?currentSchema=${current_schema}${extra_params}"

      kubectl -n candle create secret generic "${svc}-db" \
        --from-literal=host=postgres \
        --from-literal=port=5432 \
        --from-literal=dbname="$APP_DB" \
        --from-literal=schema="$schema" \
        --from-literal=username="$schema" \
        --from-literal=password="$pw" \
        --from-literal=SPRING_DATASOURCE_URL="$spring_url" \
        --from-literal=SPRING_DATASOURCE_USERNAME="$schema" \
        --from-literal=SPRING_DATASOURCE_PASSWORD="$pw" \
        --from-literal=${prefix}_DB_URL="$spring_url" \
        --from-literal=${prefix}_DB_USERNAME="$schema" \
        --from-literal=${prefix}_DB_PASSWORD="$pw" \
        --dry-run=client -o yaml | kubectl apply -f -
    done

    # ── 4) market (TimescaleDB — 별도 인스턴스, schema 분리 아님)
    kubectl -n candle create secret generic market-service-db \
      --from-literal=host=timescaledb \
      --from-literal=port=5432 \
      --from-literal=dbname=market \
      --from-literal=username=market \
      --from-literal=password=candle-dev-market-pw \
      --from-literal=SPRING_DATASOURCE_URL="jdbc:postgresql://timescaledb:5432/market" \
      --from-literal=SPRING_DATASOURCE_USERNAME=market \
      --from-literal=SPRING_DATASOURCE_PASSWORD=candle-dev-market-pw \
      --from-literal=MARKET_DB_URL="jdbc:postgresql://timescaledb:5432/market" \
      --from-literal=MARKET_DB_USERNAME=market \
      --from-literal=MARKET_DB_PASSWORD=candle-dev-market-pw \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "=== init-db complete (db=$APP_DB, schemas=$(echo "${SERVICES[@]}" | tr ' ' ',')) ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  namespace: candle
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # 완료된 Job은 spec이 immutable → 스크립트를 고치면 patch sync가 실패한다.
    # Replace=true면 ArgoCD가 delete 후 재생성한다(매니페스트가 바뀔 때만). 이 Job은 멱등.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: init-db
      restartPolicy: OnFailure
      containers:
        - name: init
          image: alpine:3.20
          command: [/bin/sh, -c]
          args:
            - |
              apk add --no-cache postgresql16-client curl bash
              curl -sLO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
              install kubectl /usr/local/bin/kubectl
              until pg_isready -h postgres -U postgres; do
                echo "waiting postgres..."; sleep 3
              done
              exec bash /scripts/init.sh
          env:
            - name: SUPERUSER_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: password}}
          volumeMounts:
            - {name: script, mountPath: /scripts}
      volumes:
        - name: script
          configMap:
            name: init-db-script
            defaultMode: 0755
