# DB 자격증명을 클러스터 안에서 1회 생성 → Secret 저장 (git에 평문 비밀 없음).
# init-jwt-key-job과 동일한 패턴: 이미 있으면 그대로 두고, 없을 때만 만든다.
#
# 생성 대상
#   candle/postgres-superuser  : postgres superuser
#   candle/timescaledb-creds   : market (TimescaleDB)
#   candle/debezium-creds      : debezium (CDC) — kafka 네임스페이스에도 같은 값으로 복제.
#                                connectors-job이 kafka ns에서 읽어야 하기 때문.
#
# 비번 로테이션: 해당 Secret 삭제 후 이 Job 재실행 → init-db가 ALTER ROLE로 DB에 반영.
# (서비스별 role 비번은 init-db-job이 <svc>-db Secret에 직접 생성/보존한다.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: init-secrets
  namespace: candle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: init-secrets
  namespace: candle
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: init-secrets
  namespace: candle
subjects:
  - {kind: ServiceAccount, name: init-secrets, namespace: candle}
roleRef:
  kind: Role
  name: init-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-secrets
  namespace: candle
  annotations:
    # postgres/timescaledb 파드보다 먼저 Secret이 있어야 한다. 늦어도 k8s가 재시도로 흡수.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: init-secrets
      restartPolicy: OnFailure
      containers:
        - name: init
          image: alpine:3.20
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              apk add --no-cache openssl curl >/dev/null

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc

              k() { curl -sf --cacert "$CA" -H "Authorization: Bearer $TOKEN" "$@"; }

              # $1=ns $2=name → Secret JSON (없으면 빈 문자열)
              get_secret() { k "$API/api/v1/namespaces/$1/secrets/$2" || true; }

              # $1=JSON $2=key → base64 값
              json_val() {
                echo "$1" | tr ',' '\n' | grep "\"$2\"" | head -1 \
                  | sed 's/.*"'"$2"'" *: *"\([^"]*\)".*/\1/'
              }

              b64() { printf '%s' "$1" | base64 | tr -d '\n'; }

              # 영숫자만(32 hex) — SQL 리터럴/JSON/셸 어디에 넣어도 이스케이프 걱정 없음
              gen_pw() { openssl rand -hex 16; }

              # $1=ns $2=name $3=username(없으면 빈 문자열) → stdout: password(base64)
              ensure_secret() {
                _ns=$1; _name=$2; _user=$3
                _cur=$(get_secret "$_ns" "$_name")
                if [ -n "$_cur" ]; then
                  echo "  $_ns/$_name 이미 존재 — 유지" >&2
                  json_val "$_cur" password
                  return 0
                fi
                _pw=$(b64 "$(gen_pw)")
                if [ -n "$_user" ]; then
                  _data="\"username\":\"$(b64 "$_user")\",\"password\":\"$_pw\""
                else
                  _data="\"password\":\"$_pw\""
                fi
                k -H 'Content-Type: application/json' -X POST \
                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$_name\"},\"type\":\"Opaque\",\"data\":{$_data}}" \
                  "$API/api/v1/namespaces/$_ns/secrets" >/dev/null
                echo "  $_ns/$_name 생성" >&2
                echo "$_pw"
              }

              echo "─ candle 네임스페이스 ─"
              ensure_secret candle postgres-superuser ""         >/dev/null
              ensure_secret candle timescaledb-creds  "market"   >/dev/null
              DBZ_PW=$(ensure_secret candle debezium-creds "debezium")

              # ─ kafka ns에 debezium-creds 복제 (connectors-job이 여기서 읽는다)
              echo "─ kafka 네임스페이스 복제 ─"
              DBZ_USER=$(b64 debezium)
              BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"debezium-creds\"},\"type\":\"Opaque\",\"data\":{\"username\":\"$DBZ_USER\",\"password\":\"$DBZ_PW\"}}"
              if [ -n "$(get_secret kafka debezium-creds)" ]; then
                # candle 쪽 값이 정본 — 항상 덮어써서 두 네임스페이스를 일치시킨다
                k -H 'Content-Type: application/json' -X PUT -d "$BODY" \
                  "$API/api/v1/namespaces/kafka/secrets/debezium-creds" >/dev/null
                echo "  kafka/debezium-creds 갱신"
              else
                k -H 'Content-Type: application/json' -X POST -d "$BODY" \
                  "$API/api/v1/namespaces/kafka/secrets" >/dev/null
                echo "  kafka/debezium-creds 생성"
              fi

              echo "=== init-secrets complete ==="
