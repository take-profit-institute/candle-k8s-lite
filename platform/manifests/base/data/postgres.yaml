# 공용 Postgres — 서비스별 DB(auth/users/trading/...) + logical replication(Debezium)
# 프로덕션 RDS 대체. dev용 단일 인스턴스.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: candle
spec:
  clusterIP: None  # headless — StatefulSet 표준
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: candle
data:
  # Debezium용 logical replication 활성
  postgresql.conf: |
    listen_addresses = '*'
    wal_level = logical
    max_wal_senders = 10
    max_replication_slots = 10
    shared_buffers = 256MB
    max_connections = 200
  pg_hba.conf: |
    host all all 0.0.0.0/0 md5
    host replication all 0.0.0.0/0 md5
    local all all trust
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: candle
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-superuser, key: password}
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: config, mountPath: /etc/postgresql}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: postgres-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path   # k3s 기본
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: candle
type: Opaque
stringData:
  # ⚠️ dev only — 실제 배포 전 변경 권장
  password: candle-dev-postgres-pw
