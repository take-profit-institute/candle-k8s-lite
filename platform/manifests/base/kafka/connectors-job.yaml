---
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-connectors-apply
  namespace: kafka
  annotations:
    # 완료된 Job은 spec immutable → 커넥터 JSON을 고치면 재생성이 필요하다.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: curlimages/curl:8.11.0
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              API=http://kafka-connect:8083
              until curl -sf $API/connectors >/dev/null; do
                echo "waiting kafka-connect..."; sleep 5
              done

              for f in /connectors/*.json; do
                # 커넥터 이름은 JSON의 최상위 "name" (파일명 아님 — user.json → user-outbox)
                name=$(sed -n 's/.*"name": *"\([^"]*\)".*/\1/p' "$f" | head -1)
                echo "─ $name ─"

                # 구버전 커넥터 정리: dbname이 candle이 아니면(= 서비스별 DB를 보던 옛 설정) 삭제 후 재생성.
                # slot.name/topic.prefix가 함께 바뀌어 config PUT만으로는 전환되지 않는다.
                # 이미 candle이면 건너뛰므로 재실행해도 offset이 초기화되지 않는다(멱등).
                cur=$(curl -sf "$API/connectors/$name/config" 2>/dev/null || true)
                if [ -n "$cur" ] && ! echo "$cur" | grep -q '"database.dbname" *: *"candle"'; then
                  echo "  legacy config 감지 → DELETE $name"
                  curl -sf -X DELETE "$API/connectors/$name" || true
                  sleep 3
                fi

                # 존재하면 update, 없으면 create
                curl -sf -X PUT -H 'Content-Type: application/json' --data @"$f" \
                  "$API/connectors/$name/config" \
                  || curl -sf -X POST -H 'Content-Type: application/json' \
                     --data @"$f" $API/connectors
                echo
              done

              echo "=== 등록된 커넥터 ==="
              # 확인용 출력일 뿐 — 여기서 실패해도 등록은 이미 끝났으므로 Job을 죽이지 않는다.
              curl -sf $API/connectors || true
          volumeMounts:
            - {name: connectors, mountPath: /connectors}
      volumes:
        - name: connectors
          configMap: {name: debezium-connectors}
