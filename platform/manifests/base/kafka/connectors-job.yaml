# prod의 kafka-connector-*.yaml (Strimzi CR) 대응.
# 커넥터 spec을 Connect REST API로 PUT — Connect가 준비되면 Job이 자동 등록.
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connectors
  namespace: kafka
data:
  # 파일명 = 커넥터 이름(<name>.json), 내용 = config 객체만.
  # PUT /connectors/<name>/config 는 없으면 생성·있으면 갱신이라 이 호출 하나로 끝난다.
  #
  # init-db-job이 만드는 단일 candle DB의 <schema>.outbox_events를 감시한다.
  # (DB가 서비스별로 나뉘어 있지 않다 — dbname은 전부 candle, 구분은 schema로.)
  #
  # outbox 테이블명은 서비스마다 다르다(prod 커넥터와 동일):
  #   auth/notification/stock/wishlist → <schema>.outbox_events
  #   users → users.user_outbox_events / ranking → ranking.ranking_outbox_events
  #   trading → account/order_svc/reservation 3개 스키마의 outbox_events를 한 커넥터가 캡처
  #
  # EventRouter 필드도 서비스마다 다르다(실제 컬럼 기준):
  #   대부분     : id / event_type / aggregate_id / payload
  #   notification: PK가 event_id
  #   ranking     : PK가 event_id
  #   users       : event_type·aggregate_id가 아예 없고 topic / partition_key를 쓴다
  #
  # 비번은 git에 두지 않는다 — __DEBEZIUM_PASSWORD__ 자리표시자를 Job이 kafka/debezium-creds
  # Secret 값으로 치환해 POST한다. (Secret은 init-secrets-job이 생성·복제)
  #
  # publication은 prod처럼 사전생성(Terraform)이 없으므로 autocreate=filtered로 커넥터가 직접
  # 만든다. 이를 위해 init-db-job이 debezium에게 DB CREATE + 각 서비스 role 멤버십을 부여한다.
  auth-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.auth",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_auth",
      "publication.name": "dbz_pub_auth",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "auth.outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "aggregate_id",
      "transforms.outbox.table.field.event.type": "event_type",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
  user-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.user",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_users",
      "publication.name": "dbz_pub_users",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "users.user_outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "topic",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "partition_key",
      "transforms.outbox.table.field.event.type": "topic",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
  trading-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.trading",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_trading",
      "publication.name": "dbz_pub_trading",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "account.outbox_events,order_svc.outbox_events,reservation.outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "aggregate_id",
      "transforms.outbox.table.field.event.type": "event_type",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
  ranking-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.ranking",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_ranking",
      "publication.name": "dbz_pub_ranking",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "ranking.ranking_outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "aggregate_id",
      "transforms.outbox.table.field.event.id": "event_id",
      "transforms.outbox.table.field.event.type": "event_type",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
  notification-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.notification",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_notification",
      "publication.name": "dbz_pub_notification",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "notification.outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "aggregate_id",
      "transforms.outbox.table.field.event.id": "event_id",
      "transforms.outbox.table.field.event.type": "event_type",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
  stock-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.stock",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_stock",
      "publication.name": "dbz_pub_stock",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "stock.outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "aggregate_id",
      "transforms.outbox.table.field.event.type": "event_type",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false"
    }
  wishlist-outbox.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "database.hostname": "postgres.candle.svc.cluster.local",
      "database.port": "5432",
      "database.user": "debezium",
      "database.password": "__DEBEZIUM_PASSWORD__",
      "database.dbname": "candle",
      "topic.prefix": "candle.wishlist",
      "plugin.name": "pgoutput",
      "slot.name": "debezium_wishlist",
      "publication.name": "dbz_pub_wishlist",
      "publication.autocreate.mode": "filtered",
      "table.include.list": "wishlist.outbox_events",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.field.event.key": "aggregate_id",
