  wishlist.json: |
    {
      "name": "wishlist-outbox",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "postgres.candle.svc.cluster.local",
        "database.port": "5432",
        "database.user": "debezium",
