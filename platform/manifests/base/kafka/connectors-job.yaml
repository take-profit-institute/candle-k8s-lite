---
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-connectors-apply
  namespace: kafka
  annotations:
    # Sync hook + BeforeHookCreation = 매 sync마다 이전 Job 삭제 후 재생성.
    # (완료된 Job은 spec immutable + 컨트롤러 주입 selector 때문에 replace/patch 모두 실패한다)
    # PUT config는 없으면 생성·있으면 갱신이라 재실행이 안전하다.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: curlimages/curl:8.11.0
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              API=http://kafka-connect:8083
              until curl -sf $API/connectors >/dev/null; do
                echo "waiting kafka-connect..."; sleep 5
              done

              for f in /connectors/*.json; do
                name=$(basename "$f" .json)
                echo "─ $name ─"

                # 자리표시자 → 실제 비번. ConfigMap 마운트는 read-only라 /tmp에 쓴다.
                body=/tmp/$name.json
                sed "s|__DEBEZIUM_PASSWORD__|$DEBEZIUM_PASSWORD|" "$f" > "$body"

                # 구버전 커넥터 정리: dbname이 candle이 아니면(= 서비스별 DB를 보던 옛 설정)
                # 삭제 후 재생성. slot.name/topic.prefix가 함께 바뀌어 갱신만으로는 전환되지 않는다.
                # 이미 candle이면 건너뛰므로 재실행해도 offset이 초기화되지 않는다.
                cur=$(curl -sf "$API/connectors/$name/config" || true)
                if [ -n "$cur" ] && ! echo "$cur" | grep -q '"database.dbname" *: *"candle"'; then
                  echo "  legacy config 감지 → DELETE"
                  curl -sf -X DELETE "$API/connectors/$name" || true
                  sleep 3
                fi

                # 없으면 생성, 있으면 갱신 — PUT config 하나로 처리.
                # 응답 본문에 비번이 들어있으므로 로그로 흘리지 않는다.
                curl -sf -X PUT -H 'Content-Type: application/json' \
                  --data @"$body" "$API/connectors/$name/config" >/dev/null
                rm -f "$body"
                echo "  ok"
              done

              echo "=== 등록된 커넥터 ==="
              # 확인용 출력일 뿐 — 여기서 실패해도 등록은 이미 끝났으므로 Job을 죽이지 않는다.
              curl -sf $API/connectors || true
          env:
            - name: DEBEZIUM_PASSWORD
              valueFrom: {secretKeyRef: {name: debezium-creds, key: password}}
          volumeMounts:
            - {name: connectors, mountPath: /connectors}
      volumes:
        - name: connectors
          configMap: {name: debezium-connectors}
