# Kafka Connect — Debezium Postgres 커넥터 런타임.
# prod: Strimzi KafkaConnect (SCRAM-SHA-512+TLS to MSK)
# lite: 단순 Deployment (PLAINTEXT → 인클러스터 kafka)
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
spec:
  selector: {app: kafka-connect}
  ports:
    - {name: rest, port: 8083, targetPort: 8083}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-config
  namespace: kafka
data:
  # Debezium 이미지에 이미 플러그인 포함 → 그대로 사용
  BOOTSTRAP_SERVERS: kafka-0.kafka.kafka.svc.cluster.local:9092
  GROUP_ID: candle-lite-connect
  CONFIG_STORAGE_TOPIC: connect-configs
  OFFSET_STORAGE_TOPIC: connect-offsets
  STATUS_STORAGE_TOPIC: connect-status
  CONFIG_STORAGE_REPLICATION_FACTOR: "1"
  OFFSET_STORAGE_REPLICATION_FACTOR: "1"
  STATUS_STORAGE_REPLICATION_FACTOR: "1"
  KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kafka-connect}
  template:
    metadata:
      labels: {app: kafka-connect}
    spec:
      containers:
        - name: connect
          # 공식 Debezium Connect 이미지 (postgres 커넥터 포함)
          image: debezium/connect:2.7.3.Final
          ports: [{containerPort: 8083, name: rest}]
          envFrom:
            - configMapRef: {name: kafka-connect-config}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /connectors, port: 8083}
            periodSeconds: 10
            failureThreshold: 30
