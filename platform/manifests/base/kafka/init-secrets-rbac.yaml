# candle ns의 init-secrets Job이 kafka ns에도 debezium-creds를 만들 수 있게 하는 RBAC.
# (Secret은 네임스페이스 리소스라 kafka ns 쪽에서 권한을 열어줘야 한다.
#  connectors-job이 kafka ns에서 debezium 비번을 읽기 때문에 복제가 필요하다.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: init-secrets-writer
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: init-secrets-writer
  namespace: kafka
subjects:
  - {kind: ServiceAccount, name: init-secrets, namespace: candle}
roleRef:
  kind: Role
  name: init-secrets-writer
  apiGroup: rbac.authorization.k8s.io
