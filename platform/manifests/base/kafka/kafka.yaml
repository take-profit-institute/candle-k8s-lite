# Kafka KRaft 단일 브로커 — 프로덕션 MSK(3 브로커 IAM)를 대체.
# PLAINTEXT (VPC 내부만 접근, dev only).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - {containerPort: 9092, name: broker}
            - {containerPort: 9093, name: controller}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.kafka.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.kafka.svc.cluster.local:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: CLUSTER_ID, value: "candle-lite-cluster-1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx1g"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1500Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 20Gi}
