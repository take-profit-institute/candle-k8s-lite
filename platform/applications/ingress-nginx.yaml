# ingress-nginx — k3s의 servicelb(klipper)가 hostPort로 :80/:443 노출
# → EC2 EIP :80/:443 이 그대로 ingress에 도달
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: candle-lite
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        controller:
          # 단일 노드니까 replica 1
          replicaCount: 1
          # klipper LB 사용 (k3s 기본)
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          # 리소스 절약
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # ArgoCD gRPC 지원
          config:
            use-forwarded-headers: "true"
            proxy-body-size: "50m"
          metrics:
            enabled: false
          admissionWebhooks:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
