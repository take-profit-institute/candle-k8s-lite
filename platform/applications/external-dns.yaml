# external-dns — Ingress host → Route53 A record 자동 생성.
# EC2 instance profile(Terraform이 부여)이 Route53 권한을 가짐 → IMDS로 credentials 획득.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: candle-lite
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.15.0
    helm:
      values: |
        provider: aws
        sources: [ingress]
        # 자기가 만든 레코드만 관리 (와일드카드 A는 Terraform이 소유)
        policy: sync
        registry: txt
        txtOwnerId: candle-lite-dev
        domainFilters:
          - lite.candle.io.kr
        aws:
          region: ap-northeast-2
        # k3s klipper LB가 Ingress의 external IP를 노드 사설 IP(10.20.0.x)로 세팅 →
        # 그대로 A 레코드에 쓰면 외부에서 접근 불가. default-targets로 EIP 강제.
        extraArgs:
          - --default-targets=3.37.20.111
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
